name: Build and release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 release
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '1'
      GOARCH: amd64
      CC: gcc
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            parser/go.sum

      - name: Install MinGW GCC
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add GCC to PATH
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Join-Path $env:MSYS2_LOCATION 'mingw64\bin' >> $env:GITHUB_PATH

      - name: Download Go modules
        timeout-minutes: 5
        run: go mod download -x

      - name: Verify dependency license notices
        run: |
          python -m unittest discover -s tools/licenses -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/licenses/generate.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build executable and ZIP
        timeout-minutes: 15
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          # Bundle the notices from the compiler/runtime actually used here.
          $nativeLicenses = Join-Path $env:MSYS2_LOCATION 'mingw64\share\licenses'
          python tools/licenses/generate.py --native-root $nativeLicenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A cold Fyne/CGO build takes time; -v shows package progress.
          go build -v -ldflags="-H=windowsgui" -o evela.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -LiteralPath evela.exe -DestinationPath evela.zip -Force

      - name: Verify release build identity
        run: |
          $buildInfo = go version -m evela.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($buildInfo -match "vcs\.revision=$env:GITHUB_SHA$")) {
            throw 'Executable is missing the release commit required for update checks.'
          }

      - name: Run tests
        timeout-minutes: 10
        run: |
          go test -v -timeout 5m ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C parser test -v -timeout 5m ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Also protect against manually rerunning an older workflow run.
          $headSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($headSha.Trim() -ne $env:GITHUB_SHA) {
            Write-Host 'A newer commit is on main; skipping this release.'
            exit 0
          }

          # Numeric SemVer tags sort in commit order, including same-day releases.
          # Full history makes the number stable across reruns and merged branches.
          $commitCount = git rev-list --count $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "v0.1.$($commitCount.Trim())"
          $tagRevision = git rev-parse --verify --quiet "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -eq 0 -and $tagRevision.Trim() -ne $env:GITHUB_SHA) {
            throw "Tag $tag already identifies another commit."
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            # Rerunning the same commit updates its existing release.
            gh release upload $tag evela.exe evela.zip LICENSE THIRD_PARTY_NOTICES.txt --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          } else {
            gh release create $tag evela.exe evela.zip LICENSE THIRD_PARTY_NOTICES.txt `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Evela $tag" `
              --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
